<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 88" width="160" height="88" role="img" aria-label="City horizontal avenue">
  <defs>
    <linearGradient id="asphaltCrownH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111927"/>
      <stop offset="10%" stop-color="#1b2638"/>
      <stop offset="28%" stop-color="#223046"/>
      <stop offset="50%" stop-color="#2a3b54"/>
      <stop offset="72%" stop-color="#223046"/>
      <stop offset="90%" stop-color="#1b2638"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
    <pattern id="asphaltGrainH" width="32" height="44" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="0.9" fill="#475569" opacity="0.38"/>
      <circle cx="19" cy="15" r="0.8" fill="#090f17" opacity="0.48"/>
      <circle cx="27" cy="6" r="1.0" fill="#64748b" opacity="0.26"/>
      <circle cx="11" cy="29" r="0.9" fill="#090f17" opacity="0.42"/>
      <circle cx="25" cy="36" r="1.1" fill="#475569" opacity="0.32"/>
      <circle cx="4" cy="40" r="0.8" fill="#cbd5e1" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Main Crowned Asphalt Roadbed -->
  <rect width="160" height="88" fill="url(#asphaltCrownH)"/>
  <rect width="160" height="88" fill="url(#asphaltGrainH)"/>

  <!-- Subtle Dual Tire-Wear Tracks along Westbound (y=26) and Eastbound (y=62) Lanes -->
  <rect x="0" y="18.5" width="160" height="3.5" fill="#0f172a" opacity="0.36"/>
  <rect x="0" y="29.5" width="160" height="3.5" fill="#0f172a" opacity="0.36"/>
  <rect x="0" y="55" width="160" height="3.5" fill="#0f172a" opacity="0.36"/>
  <rect x="0" y="66" width="160" height="3.5" fill="#0f172a" opacity="0.36"/>

  <!-- Top 3D Concrete Curb Stone & Recessed Gutter Shadow -->
  <rect x="0" y="0" width="160" height="3" fill="#f8fafc"/>
  <rect x="0" y="3" width="160" height="2.5" fill="#94a3b8"/>
  <rect x="0" y="5.5" width="160" height="3" fill="#090f17" opacity="0.72"/>

  <!-- Bottom 3D Concrete Curb Stone & Recessed Gutter Shadow -->
  <rect x="0" y="79.5" width="160" height="3" fill="#090f17" opacity="0.72"/>
  <rect x="0" y="82.5" width="160" height="2.5" fill="#94a3b8"/>
  <rect x="0" y="85" width="160" height="3" fill="#e2e8f0"/>

  <!-- Seamless 32px Curb Stone Mortar Joints (0, 32, 64, 96, 128) -->
  <g stroke="#475569" stroke-width="1" opacity="0.55">
    <line x1="32" y1="0" x2="32" y2="5.5"/>
    <line x1="64" y1="0" x2="64" y2="5.5"/>
    <line x1="96" y1="0" x2="96" y2="5.5"/>
    <line x1="128" y1="0" x2="128" y2="5.5"/>
    <line x1="32" y1="82.5" x2="32" y2="88"/>
    <line x1="64" y1="82.5" x2="64" y2="88"/>
    <line x1="96" y1="82.5" x2="96" y2="88"/>
    <line x1="128" y1="82.5" x2="128" y2="88"/>
  </g>

  <!-- Recessed Cast-Iron Curb Storm Drain Grates -->
  <g fill="#070c14" stroke="#475569" stroke-width="0.7">
    <rect x="73" y="4.5" width="14" height="3.8" rx="1"/>
    <rect x="73" y="79.7" width="14" height="3.8" rx="1"/>
  </g>

  <!-- Crisp White Outer Shoulder Fog Lines -->
  <line x1="0" y1="9.5" x2="160" y2="9.5" stroke="#f8fafc" stroke-width="1.8" opacity="0.78"/>
  <line x1="0" y1="78.5" x2="160" y2="78.5" stroke="#f8fafc" stroke-width="1.8" opacity="0.78"/>

  <!-- Subtle Directional Lane Flow Arrows (Westbound at y=26, Eastbound at y=62) -->
  <g fill="#f8fafc" opacity="0.22">
    <path d="M 106,26 L 114,21.5 L 114,24.2 L 124,24.2 L 124,27.8 L 114,27.8 L 114,30.5 Z"/>
    <path d="M 54,62 L 46,57.5 L 46,60.2 L 36,60.2 L 36,63.8 L 46,63.8 L 46,66.5 Z"/>
  </g>

  <!-- Center Median Asphalt Channel + Double Amber-Gold Divider -->
  <rect x="0" y="40.2" width="160" height="7.6" fill="#0d1522" opacity="0.58"/>
  <line x1="0" y1="41.6" x2="160" y2="41.6" stroke="#fbbf24" stroke-width="2.2" opacity="0.96"/>
  <line x1="0" y1="46.4" x2="160" y2="46.4" stroke="#f59e0b" stroke-width="2.2" opacity="0.96"/>

  <!-- Glowing Reflective Amber Cat's-Eye Road Studs (every 40px: 20, 60, 100, 140) -->
  <g fill="#fef08a" stroke="#d97706" stroke-width="0.6">
    <rect x="18" y="42.9" width="4" height="2.2" rx="0.8"/>
    <rect x="58" y="42.9" width="4" height="2.2" rx="0.8"/>
    <rect x="98" y="42.9" width="4" height="2.2" rx="0.8"/>
    <rect x="138" y="42.9" width="4" height="2.2" rx="0.8"/>
  </g>
</svg>
