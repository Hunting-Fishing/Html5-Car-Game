<svg xmlns="http://www.w3.org/2000/svg" width="240" height="124" viewBox="0 0 240 124" role="img" aria-label="North American 4x4 Baja Raptor Pickup (North American Market)">
  <defs>
    <linearGradient id="body_na_raptor_4x4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Ground Contact Shadow -->
  <ellipse cx="118" cy="108" rx="98" ry="11" fill="#020810" opacity="0.40"/>
  
      <!-- Bed Chase Rack & Roof LED Off-Road Lightbar -->
      <path d="M84 54 L106 34 H114 L94 54 Z" fill="#1e293b" stroke="#06131d" stroke-width="2.5"/>
      <rect x="104" y="27" width="16" height="6" rx="3" fill="#fef08a" stroke="#06131d" stroke-width="2"/>
      <!-- Lifted Crew-Cab 4x4 Pickup Body -->
      <path d="M18 82 L20 52 H98 V34 H158 L178 54 L212 58 L214 84 H18 Z" fill="url(#body_na_raptor_4x4)" stroke="#06131d" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Crew Cab Tinted Windows -->
      <polygon points="104,40 128,40 128,54 104,54" fill="#0f293d" stroke="#7dd3fc" stroke-width="1.5"/>
      <polygon points="133,40 154,40 171,54 133,54" fill="#0f293d" stroke="#7dd3fc" stroke-width="1.5"/>
      <!-- Matte Black Wide Baja Fender Flares & Bullbar -->
      <path d="M36 84 A 26 26 0 0 1 88 84" fill="none" stroke="#0f172a" stroke-width="7"/>
      <path d="M148 84 A 26 26 0 0 1 200 84" fill="none" stroke="#0f172a" stroke-width="7"/>
      <path d="M210 58 L220 64 L216 82 H208" fill="none" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
      <!-- Amber Grille Marker Lights & Off-Road Stripe -->
      <rect x="28" y="64" width="120" height="5" rx="2.5" fill="#ffd166"/>
      <rect x="202" y="62" width="10" height="10" rx="2" fill="#f59e0b" stroke="#06131d" stroke-width="1.5"/>
      <rect x="18" y="56" width="7" height="14" rx="2" fill="#ef4444"/>
    
  <!-- Recessed Wheel Arches & Brake Calipers (for real rotating wheels) -->
  
    <g transform="translate(62, 92)">
      <circle r="23" fill="#020617"/>
      <circle r="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-15 -6 A 16 16 0 0 1 -15 6" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="20" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="15" fill="none" stroke="#94a3b8" stroke-width="2.2"/>
        <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-15" x2="0" y2="15"/>
          <line x1="-12.9" y1="-7.5" x2="12.9" y2="7.5"/>
          <line x1="12.9" y1="-7.5" x2="-12.9" y2="7.5"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#ffd166" stroke-width="1.5"/>
      
    </g>
  
    <g transform="translate(174, 92)">
      <circle r="23" fill="#020617"/>
      <circle r="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-15 -6 A 16 16 0 0 1 -15 6" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="20" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="15" fill="none" stroke="#94a3b8" stroke-width="2.2"/>
        <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-15" x2="0" y2="15"/>
          <line x1="-12.9" y1="-7.5" x2="12.9" y2="7.5"/>
          <line x1="12.9" y1="-7.5" x2="-12.9" y2="7.5"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#ffd166" stroke-width="1.5"/>
      
    </g>
  
</svg>
