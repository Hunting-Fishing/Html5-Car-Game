      <path d="M16 88 L20 56 L58 52 L84 36 H136 L158 53 L212 58 L216 86 H16 Z" fill="url(#body_na_v8_muscle)" stroke="#06131d" stroke-width="4.5" stroke-linejoin="round"/>
      <polygon points="66,51 88,41 132,41 152,53" fill="#0f293d" stroke="#7dd3fc" stroke-width="1.5"/>
      <!-- Matte Black Hockey-Stick Muscle Stripe & Chrome Side Exhaust Pipe -->
      <path d="M156 56 L144 74 H42" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
      <rect x="86" y="84" width="64" height="5" rx="2.5" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="204" y="62" width="10" height="8" rx="2" fill="#fef08a"/>
      <rect x="16" y="60" width="8" height="10" rx="2" fill="#ef4444"/>
    
  <!-- Recessed Wheel Arches & Brake Calipers (for real rotating wheels) -->
  
    <g transform="translate(64, 92)">
      <circle r="20" fill="#020617"/>
      <circle r="13" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-12 -6 A 13 13 0 0 1 -12 6" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="17" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="12" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>
        <g stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-12" x2="0" y2="12"/>
          <line x1="-10.32" y1="-6" x2="10.32" y2="6"/>
          <line x1="10.32" y1="-6" x2="-10.32" y2="6"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
      
    </g>
  
    <g transform="translate(174, 92)">
      <circle r="20" fill="#020617"/>
