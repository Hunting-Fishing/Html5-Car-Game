<svg xmlns="http://www.w3.org/2000/svg" width="240" height="124" viewBox="0 0 240 124" role="img" aria-label="North American Crimson V8 Muscle (North American Market)">
  <defs>
    <linearGradient id="body_na_v8_muscle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>
  <!-- Ground Contact Shadow -->
  <ellipse cx="118" cy="108" rx="98" ry="11" fill="#020810" opacity="0.40"/>
  
      <!-- V8 Supercharger Shaker Hood Scoop & Rear Ducktail -->
      <path d="M154 54 L164 46 H192 L196 55 Z" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
      <path d="M18 58 L14 48 L28 54 Z" fill="#0f172a"/>
