<svg xmlns="http://www.w3.org/2000/svg" width="240" height="124" viewBox="0 0 240 124" role="img" aria-label="North American Bronco Trophy SUV (North American Market)">
  <defs>
    <linearGradient id="body_na_baja_bronco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- Ground Contact Shadow -->
  <ellipse cx="118" cy="108" rx="98" ry="11" fill="#020810" opacity="0.40"/>
  
      <!-- Rear Tailgate Spare Tire & Roof Adventure Rack -->
      <rect x="12" y="48" width="14" height="28" rx="5" fill="#1e293b" stroke="#06131d" stroke-width="3"/>
      <rect x="44" y="28" width="96" height="5" rx="2.5" fill="#0f172a"/>
      <!-- Modular Black Hardtop & Boxy 4x4 SUV Body -->
      <path d="M24 84 V36 H152 L172 56 L210 60 L212 84 H24 Z" fill="url(#body_na_baja_bronco)" stroke="#06131d" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M26 36 H148 L166 55 H26 Z" fill="#1e293b"/>
      <rect x="34" y="41" width="38" height="14" rx="2" fill="#0f293d" stroke="#7dd3fc" stroke-width="1.5"/>
      <rect x="78" y="41" width="34" height="14" rx="2" fill="#0f293d" stroke="#7dd3fc" stroke-width="1.5"/>
