      <rect x="36" y="68" width="152" height="5" rx="2.5" fill="#fde047"/>
      <circle cx="204" cy="68" r="5" fill="#fef08a"/>
    
  <!-- Recessed Wheel Arches & Brake Calipers (for real rotating wheels) -->
  
    <g transform="translate(64, 92)">
      <circle r="22" fill="#020617"/>
      <circle r="15" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-14 -6 A 15 15 0 0 1 -14 6" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="19" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="14" fill="none" stroke="#cbd5e1" stroke-width="2.2"/>
        <g stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-14" x2="0" y2="14"/>
          <line x1="-12.04" y1="-7" x2="12.04" y2="7"/>
          <line x1="12.04" y1="-7" x2="-12.04" y2="7"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#fde047" stroke-width="1.5"/>
      
    </g>
  
    <g transform="translate(174, 92)">
      <circle r="22" fill="#020617"/>
      <circle r="15" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-14 -6 A 15 15 0 0 1 -14 6" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="19" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="14" fill="none" stroke="#cbd5e1" stroke-width="2.2"/>
        <g stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-14" x2="0" y2="14"/>
          <line x1="-12.04" y1="-7" x2="12.04" y2="7"/>
          <line x1="12.04" y1="-7" x2="-12.04" y2="7"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#fde047" stroke-width="1.5"/>
      
