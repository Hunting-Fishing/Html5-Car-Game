<svg xmlns="http://www.w3.org/2000/svg" width="240" height="124" viewBox="0 0 240 124" role="img" aria-label="North American 365 Fleet Transit Van (North American Market)">
  <defs>
    <linearGradient id="body_na_transit_van" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Ground Contact Shadow -->
  <ellipse cx="118" cy="108" rx="98" ry="11" fill="#020810" opacity="0.40"/>
  
      <!-- Roof Cargo Rack -->
      <rect x="38" y="26" width="106" height="5" rx="2" fill="#94a3b8" stroke="#06131d" stroke-width="2"/>
      <!-- High-Roof Commercial Van Body -->
      <path d="M22 88 V38 Q22 30 32 30 H154 L184 56 L208 64 V88 H22 Z" fill="url(#body_na_transit_van)" stroke="#06131d" stroke-width="4.5" stroke-linejoin="round"/>
      <polygon points="142,36 154,36 178,56 142,56" fill="#0f293d" stroke="#7dd3fc" stroke-width="1.5"/>
      <!-- 365 Fleet Logistics Stripe & Badge -->
      <rect x="28" y="64" width="168" height="8" rx="4" fill="#35e58a"/>
      <rect x="42" y="42" width="76" height="18" rx="5" fill="#06131d" opacity="0.85"/>
      <text x="80" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#35e58a">365 FLEET</text>
      <rect x="198" y="68" width="9" height="8" rx="2" fill="#fef08a"/>
      <rect x="20" y="62" width="6" height="14" rx="2" fill="#ef4444"/>
    
  <!-- Recessed Wheel Arches & Brake Calipers (for real rotating wheels) -->
  
    <g transform="translate(64, 92)">
      <circle r="20" fill="#020617"/>
      <circle r="13" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-12 -6 A 13 13 0 0 1 -12 6" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="17" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="12" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>
        <g stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-12" x2="0" y2="12"/>
          <line x1="-10.32" y1="-6" x2="10.32" y2="6"/>
          <line x1="10.32" y1="-6" x2="-10.32" y2="6"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#35e58a" stroke-width="1.5"/>
      
    </g>
  
    <g transform="translate(174, 92)">
      <circle r="20" fill="#020617"/>
      <circle r="13" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-12 -6 A 13 13 0 0 1 -12 6" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="17" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="12" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>
        <g stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-12" x2="0" y2="12"/>
          <line x1="-10.32" y1="-6" x2="10.32" y2="6"/>
          <line x1="10.32" y1="-6" x2="-10.32" y2="6"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#35e58a" stroke-width="1.5"/>
      
    </g>
  
</svg>
