<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 160" width="88" height="160" role="img" aria-label="City vertical avenue">
  <defs>
    <linearGradient id="asphaltCrownV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111927"/>
      <stop offset="10%" stop-color="#1b2638"/>
      <stop offset="28%" stop-color="#223046"/>
      <stop offset="50%" stop-color="#2a3b54"/>
      <stop offset="72%" stop-color="#223046"/>
      <stop offset="90%" stop-color="#1b2638"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
    <pattern id="asphaltGrainV" width="44" height="32" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="6" r="0.9" fill="#475569" opacity="0.38"/>
      <circle cx="15" cy="19" r="0.8" fill="#090f17" opacity="0.48"/>
      <circle cx="6" cy="27" r="1.0" fill="#64748b" opacity="0.26"/>
      <circle cx="29" cy="11" r="0.9" fill="#090f17" opacity="0.42"/>
      <circle cx="36" cy="25" r="1.1" fill="#475569" opacity="0.32"/>
      <circle cx="40" cy="4" r="0.8" fill="#cbd5e1" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Main Crowned Asphalt Roadbed -->
  <rect width="88" height="160" fill="url(#asphaltCrownV)"/>
  <rect width="88" height="160" fill="url(#asphaltGrainV)"/>

  <!-- Subtle Dual Tire-Wear Tracks along Northbound (x=26) and Southbound (x=62) Lanes -->
  <rect x="18.5" y="0" width="3.5" height="160" fill="#0f172a" opacity="0.36"/>
  <rect x="29.5" y="0" width="3.5" height="160" fill="#0f172a" opacity="0.36"/>
  <rect x="55" y="0" width="3.5" height="160" fill="#0f172a" opacity="0.36"/>
  <rect x="66" y="0" width="3.5" height="160" fill="#0f172a" opacity="0.36"/>

  <!-- Left 3D Concrete Curb Stone & Recessed Gutter Shadow -->
  <rect x="0" y="0" width="3" height="160" fill="#f8fafc"/>
  <rect x="3" y="0" width="2.5" height="160" fill="#94a3b8"/>
  <rect x="5.5" y="0" width="3" height="160" fill="#090f17" opacity="0.72"/>

  <!-- Right 3D Concrete Curb Stone & Recessed Gutter Shadow -->
  <rect x="79.5" y="0" width="3" height="160" fill="#090f17" opacity="0.72"/>
  <rect x="82.5" y="0" width="2.5" height="160" fill="#94a3b8"/>
  <rect x="85" y="0" width="3" height="160" fill="#e2e8f0"/>

  <!-- Seamless 32px Curb Stone Mortar Joints (0, 32, 64, 96, 128) -->
  <g stroke="#475569" stroke-width="1" opacity="0.55">
    <line x1="0" y1="32" x2="5.5" y2="32"/>
    <line x1="0" y1="64" x2="5.5" y2="64"/>
    <line x1="0" y1="96" x2="5.5" y2="96"/>
    <line x1="0" y1="128" x2="5.5" y2="128"/>
    <line x1="82.5" y1="32" x2="88" y2="32"/>
    <line x1="82.5" y1="64" x2="88" y2="64"/>
    <line x1="82.5" y1="96" x2="88" y2="96"/>
    <line x1="82.5" y1="128" x2="88" y2="128"/>
  </g>

  <!-- Recessed Cast-Iron Curb Storm Drain Grates -->
  <g fill="#070c14" stroke="#475569" stroke-width="0.7">
    <rect x="4.5" y="73" width="3.8" height="14" rx="1"/>
    <rect x="79.7" y="73" width="3.8" height="14" rx="1"/>
  </g>

  <!-- Crisp White Outer Shoulder Fog Lines -->
  <line x1="9.5" y1="0" x2="9.5" y2="160" stroke="#f8fafc" stroke-width="1.8" opacity="0.78"/>
  <line x1="78.5" y1="0" x2="78.5" y2="160" stroke="#f8fafc" stroke-width="1.8" opacity="0.78"/>

  <!-- Subtle Directional Lane Flow Arrows -->
  <g fill="#f8fafc" opacity="0.22">
    <path d="M 26,34 L 21.5,42 L 24.2,42 L 24.2,52 L 27.8,52 L 27.8,42 L 30.5,42 Z"/>
    <path d="M 62,126 L 57.5,118 L 60.2,118 L 60.2,108 L 63.8,108 L 63.8,118 L 66.5,118 Z"/>
  </g>

  <!-- Center Median Asphalt Channel + Double Amber-Gold Divider -->
  <rect x="40.2" y="0" width="7.6" height="160" fill="#0d1522" opacity="0.58"/>
  <line x1="41.6" y1="0" x2="41.6" y2="160" stroke="#fbbf24" stroke-width="2.2" opacity="0.96"/>
  <line x1="46.4" y1="0" x2="46.4" y2="160" stroke="#f59e0b" stroke-width="2.2" opacity="0.96"/>

  <!-- Glowing Reflective Amber Cat's-Eye Road Studs (every 40px: 20, 60, 100, 140) -->
  <g fill="#fef08a" stroke="#d97706" stroke-width="0.6">
    <rect x="42.9" y="18" width="2.2" height="4" rx="0.8"/>
    <rect x="42.9" y="58" width="2.2" height="4" rx="0.8"/>
    <rect x="42.9" y="98" width="2.2" height="4" rx="0.8"/>
    <rect x="42.9" y="138" width="2.2" height="4" rx="0.8"/>
  </g>
</svg>
