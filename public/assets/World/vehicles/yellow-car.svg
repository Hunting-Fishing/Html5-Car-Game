<svg xmlns="http://www.w3.org/2000/svg" width="240" height="124" viewBox="0 0 240 124" role="img" aria-label="Asian Crown Hybrid Taxi (Asian Market)">
  <defs>
    <linearGradient id="body_tokyo_taxi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Ground Contact Shadow -->
  <ellipse cx="118" cy="108" rx="98" ry="11" fill="#020810" opacity="0.40"/>
  
      <!-- Glowing Roof Taxi Lantern -->
      <rect x="102" y="25" width="28" height="10" rx="4" fill="#fef08a" stroke="#06131d" stroke-width="2.5"/>
      <text x="116" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="6.5" fill="#06131d">365</text>
      <!-- Three-Box Executive Asian Sedan Body -->
      <path d="M20 88 L22 60 L54 56 L76 36 H142 L168 56 L208 62 L210 88 H20 Z" fill="url(#body_tokyo_taxi)" stroke="#06131d" stroke-width="4.5" stroke-linejoin="round"/>
      <polygon points="62,55 80,41 112,41 112,55" fill="#0f293d" stroke="#7dd3fc" stroke-width="1.5"/>
      <polygon points="117,41 140,41 162,55 117,55" fill="#0f293d" stroke="#7dd3fc" stroke-width="1.5"/>
      <!-- Checkered Taxi Side Beltline -->
      <rect x="34" y="68" width="158" height="6" rx="2" fill="#0f172a"/>
      <rect x="192" y="64" width="14" height="7" rx="2" fill="#fef08a"/>
      <rect x="20" y="64" width="8" height="9" rx="2" fill="#ef4444"/>
    
  <!-- Recessed Wheel Arches & Brake Calipers (for real rotating wheels) -->
  
    <g transform="translate(64, 92)">
      <circle r="20" fill="#020617"/>
      <circle r="13" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-12 -6 A 13 13 0 0 1 -12 6" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="17" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="12" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>
        <g stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-12" x2="0" y2="12"/>
          <line x1="-10.32" y1="-6" x2="10.32" y2="6"/>
          <line x1="10.32" y1="-6" x2="-10.32" y2="6"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
      
    </g>
  
    <g transform="translate(174, 92)">
      <circle r="20" fill="#020617"/>
      <circle r="13" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-12 -6 A 13 13 0 0 1 -12 6" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="17" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="12" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>
        <g stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-12" x2="0" y2="12"/>
          <line x1="-10.32" y1="-6" x2="10.32" y2="6"/>
          <line x1="10.32" y1="-6" x2="-10.32" y2="6"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
      
    </g>
  
</svg>
