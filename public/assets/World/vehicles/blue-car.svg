<svg xmlns="http://www.w3.org/2000/svg" width="240" height="124" viewBox="0 0 240 124" role="img" aria-label="Asian Bayside Blue GT-Apex (Asian Market)">
  <defs>
    <linearGradient id="body_bayside_gt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Ground Contact Shadow -->
  <ellipse cx="118" cy="108" rx="98" ry="11" fill="#020810" opacity="0.40"/>
  
      <!-- High-Mount Carbon GT Gooseneck Wing -->
      <path d="M24 56 L14 38 H34 L28 43 L34 56 Z" fill="#0f172a" stroke="#35e58a" stroke-width="2"/>
      <!-- Low-Slung JDM Widebody Coupe Silhouette -->
      <path d="M18 88 L20 60 L48 54 L82 36 H138 L174 56 L210 64 Q218 68 216 88 H18 Z" fill="url(#body_bayside_gt)" stroke="#06131d" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Fastback Greenhouse -->
      <polygon points="62,53 86,40 134,40 166,55" fill="#0f293d" stroke="#7dd3fc" stroke-width="1.5"/>
      <line x1="108" y1="40" x2="102" y2="54" stroke="#06131d" stroke-width="3"/>
      <!-- Front Mount Intercooler (FMIC) & Side Vent -->
      <rect x="198" y="73" width="16" height="10" rx="2" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
      <path d="M88 64 L78 82 H162 L170 68" fill="none" stroke="#35e58a" stroke-width="3"/>
      <!-- Twin Round JDM Taillights & Laser Headlights -->
      <circle cx="23" cy="66" r="4" fill="#ef4444"/>
      <circle cx="23" cy="74" r="4" fill="#ef4444"/>
      <polygon points="190,62 213,67 211,72 188,68" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    
  <!-- Recessed Wheel Arches & Brake Calipers (for real rotating wheels) -->
  
    <g transform="translate(64, 92)">
      <circle r="20" fill="#020617"/>
      <circle r="13" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-12 -6 A 13 13 0 0 1 -12 6" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="17" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="12" fill="none" stroke="#facc15" stroke-width="2.2"/>
        <g stroke="#facc15" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-12" x2="0" y2="12"/>
          <line x1="-10.32" y1="-6" x2="10.32" y2="6"/>
          <line x1="10.32" y1="-6" x2="-10.32" y2="6"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#35e58a" stroke-width="1.5"/>
      
    </g>
  
    <g transform="translate(174, 92)">
      <circle r="20" fill="#020617"/>
      <circle r="13" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- Glowing Brake Caliper -->
      <path d="M-12 -6 A 13 13 0 0 1 -12 6" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      
        <circle r="17" fill="#0f172a" stroke="#020617" stroke-width="2"/>
        <circle r="12" fill="none" stroke="#facc15" stroke-width="2.2"/>
        <g stroke="#facc15" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-12" x2="0" y2="12"/>
          <line x1="-10.32" y1="-6" x2="10.32" y2="6"/>
          <line x1="10.32" y1="-6" x2="-10.32" y2="6"/>
        </g>
        <circle r="4" fill="#0f172a" stroke="#35e58a" stroke-width="1.5"/>
      
    </g>
  
</svg>
